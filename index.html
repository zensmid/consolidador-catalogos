<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consolidador de Catálogos</title>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
const { useState } = React;

// API URL - Tu servidor de Render
const API_URL = 'https://catalog-api-d4yz.onrender.com';

// Reemplazamos los iconos de Lucide por componentes simples
const Upload = () => <span>📤</span>;
const Download = () => <span>📥</span>;
const Check = () => <span>✓</span>;
const Loader2 = () => <span className="animate-spin">⏳</span>;
const FileSpreadsheet = () => <span>📊</span>;
const Trash2 = () => <span>🗑️</span>;
const Image = () => <span>🖼️</span>;
const DollarSign = () => <span>💰</span>;
const AlertCircle = () => <span>ℹ️</span>;

const CatalogApp = () => {
  const loadSavedData = () => {
    try {
      const saved = localStorage.getItem('catalogData');
      if (saved) {
        const data = JSON.parse(saved);
        return { results: data.results, favorites: new Set(data.favorites || []) };
      }
    } catch (e) {
      console.error('Error:', e);
    }
    return { results: null, favorites: new Set() };
  };

  const savedData = loadSavedData();
  const [files, setFiles] = useState([]);
  const [processing, setProcessing] = useState(false);
  const [results, setResults] = useState(savedData.results);
  const [step, setStep] = useState(0);
  const [logs, setLogs] = useState([]);
  const [selectedProduct, setSelectedProduct] = useState(null);
  const [filterCategory, setFilterCategory] = useState('TODAS');
  const [sortBy, setSortBy] = useState('category');
  const [customMargin, setCustomMargin] = useState(80);
  const [favorites, setFavorites] = useState(savedData.favorites);

  const addLog = (msg, type = 'info') => {
    setLogs(p => [...p, { message: msg, type, time: new Date().toLocaleTimeString() }]);
  };

  const saveData = (resultsData, favSet) => {
    try {
      localStorage.setItem('catalogData', JSON.stringify({
        results: resultsData,
        favorites: Array.from(favSet),
        timestamp: new Date().toISOString()
      }));
      addLog('💾 Guardado automáticamente', 'success');
    } catch (e) {
      console.error('Error saving:', e);
    }
  };

  const handleFileSelect = (e) => {
    const selectedFiles = Array.from(e.target.files);
    setFiles(selectedFiles);
    addLog(`📁 ${selectedFiles.length} archivo(s) seleccionado(s)`, 'info');
  };

  const processFiles = async () => {
    if (files.length === 0) {
      addLog('⚠️ Por favor selecciona archivos Excel', 'error');
      return;
    }

    setProcessing(true);
    setStep(0);
    setLogs([]);
    addLog('🚀 Iniciando procesamiento...', 'info');

    try {
      setStep(1);
      addLog(`📤 Enviando ${files.length} archivo(s) al servidor...`, 'info');

      const formData = new FormData();
      files.forEach(file => {
        formData.append('files', file);
      });

      setStep(2);
      addLog('🔄 Procesando en el servidor...', 'info');

      const response = await fetch(`${API_URL}/api/consolidate`, {
        method: 'POST',
        body: formData,
      });

      if (!response.ok) {
        throw new Error(`Error del servidor: ${response.status}`);
      }

      const data = await response.json();

      if (!data.success) {
        throw new Error(data.error || 'Error desconocido');
      }

      setStep(3);
      addLog(`✅ ${data.consolidated.length} productos consolidados`, 'success');

      setStep(4);
      addLog('🎨 Optimizando títulos y descripciones...', 'info');

      // Añadir datos optimizados para TikTok Shop
      const enrichedProducts = data.consolidated.map((p, idx) => ({
        ...p,
        optimizedTitle: `${p.description} Premium - Envío Gratis`,
        optimizedDescription: `✨ ${p.description} de alta calidad\n\n🎯 Características:\n• Material resistente\n• Fácil instalación\n• Compatible universal\n• Garantía incluida`,
        hashtags: `#${p.category.toLowerCase()} #gadgets #enviogratis #ofertas`,
        margin50: Math.ceil(p.priceMenudeo * 1.5) - 0.01,
        margin80: Math.ceil(p.priceMenudeo * 1.8) - 0.01,
        margin100: Math.ceil(p.priceMenudeo * 2) - 0.01,
      }));

      const newResults = {
        consolidated: enrichedProducts,
        stats: data.stats
      };

      setResults(newResults);
      saveData(newResults, favorites);
      
      setStep(5);
      addLog('🎉 ¡Proceso completado exitosamente!', 'success');
      addLog(`💰 Ahorro total encontrado: $${data.stats.totalSavings}`, 'success');

    } catch (error) {
      addLog(`❌ Error: ${error.message}`, 'error');
      console.error('Error completo:', error);
    } finally {
      setProcessing(false);
    }
  };

  const exportToCSV = () => {
    if (!results) return;
    let csv = 'SKU,Título,Descripción,Costo,Venta 80%,Ganancia,Hashtags\n';
    results.consolidated.forEach(p => {
      csv += `"${p.consolidated_sku}","${p.optimizedTitle}","${p.optimizedDescription.replace(/\n/g, ' ')}",${p.priceMenudeo},${p.margin80.toFixed(2)},${(p.margin80 - p.priceMenudeo).toFixed(2)},"${p.hashtags}"\n`;
    });
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Catalogo_${Date.now()}.csv`;
    a.click();
    addLog('📥 CSV descargado', 'success');
  };

  const toggleFavorite = (sku) => {
    const newFav = new Set(favorites);
    if (newFav.has(sku)) newFav.delete(sku);
    else newFav.add(sku);
    setFavorites(newFav);
    saveData(results, newFav);
  };

  const resetApp = () => {
    if (confirm('¿Borrar todo?')) {
      setResults(null);
      setLogs([]);
      setFiles([]);
      setFavorites(new Set());
      localStorage.removeItem('catalogData');
      addLog('🗑️ Datos eliminados', 'info');
    }
  };

  const getFiltered = () => {
    if (!results) return [];
    let filtered = filterCategory !== 'TODAS' 
      ? results.consolidated.filter(p => p.category === filterCategory)
      : results.consolidated;
    
    return [...filtered].sort((a, b) => {
      if (sortBy === 'price-low') return a.priceCaja - b.priceCaja;
      if (sortBy === 'price-high') return b.priceCaja - a.priceCaja;
      return a.category.localeCompare(b.category);
    });
  };

  const steps = [
    { num: 1, name: 'Subir', icon: '📤' },
    { num: 2, name: 'Procesar', icon: '🖼️' },
    { num: 3, name: 'Agrupar', icon: '✓' },
    { num: 4, name: 'Optimizar', icon: '💰' },
    { num: 5, name: 'Listo', icon: '📊' }
  ];

  // Obtener todas las categorías únicas
  const categories = results 
    ? ['TODAS', ...new Set(results.consolidated.map(p => p.category))]
    : ['TODAS'];

  return (
    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 p-4">
      <div className="max-w-7xl mx-auto">
        <div className="bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 text-white p-6 rounded-2xl mb-6 shadow-xl">
          <div className="flex justify-between items-start flex-wrap gap-4">
            <div>
              <h1 className="text-3xl font-bold mb-2">📊 Consolidador de Catálogos</h1>
              <p className="text-blue-100">Mejor precio entre proveedores + Optimizado para TikTok Shop</p>
            </div>
            {results && (
              <div className="bg-white/20 px-4 py-2 rounded-lg">
                <div className="text-xs text-blue-100">Última actualización</div>
                <div className="text-sm font-bold">
                  {new Date(JSON.parse(localStorage.getItem('catalogData') || '{}').timestamp || Date.now()).toLocaleDateString('es-MX')}
                </div>
              </div>
            )}
          </div>
        </div>

        {processing && (
          <div className="bg-white rounded-xl p-4 mb-6 shadow-lg">
            <div className="flex justify-between overflow-x-auto">
              {steps.map((s, idx) => {
                const isActive = step >= s.num;
                const isCurrent = step === s.num;
                return (
                  <div key={s.num} className="flex items-center">
                    <div className="flex flex-col items-center">
                      <div className={`w-12 h-12 rounded-full flex items-center justify-center transition-all text-2xl ${
                        isCurrent ? 'bg-blue-600 text-white animate-pulse scale-110' :
                        isActive ? 'bg-green-500 text-white' : 'bg-gray-200 text-gray-400'
                      }`}>
                        {isActive && !isCurrent ? '✓' : s.icon}
                      </div>
                      <p className="text-xs mt-1 font-medium">{s.name}</p>
                    </div>
                    {idx < steps.length - 1 && <div className={`w-12 h-1 mx-2 transition-all ${step > s.num ? 'bg-green-500' : 'bg-gray-200'}`} />}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div className="bg-white rounded-xl p-6 shadow-lg">
            <h2 className="text-xl font-bold mb-4">📁 Subir Catálogos Excel</h2>
            <p className="text-gray-600 text-sm mb-4">Sube archivos Excel (.xlsx) con imágenes embebidas</p>
            
            <div className="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-blue-500 transition-colors">
              <input
                type="file"
                multiple
                accept=".xlsx,.xls"
                onChange={handleFileSelect}
                className="hidden"
                id="file-upload"
              />
              <label htmlFor="file-upload" className="cursor-pointer">
                <div className="text-6xl mb-4">📤</div>
                <p className="text-lg font-semibold mb-2">Click para seleccionar archivos</p>
                <p className="text-sm text-gray-500">o arrastra y suelta aquí</p>
              </label>
            </div>

            {files.length > 0 && (
              <div className="mt-4 space-y-2">
                <p className="font-semibold">Archivos seleccionados:</p>
                {files.map((file, idx) => (
                  <div key={idx} className="flex items-center gap-2 bg-blue-50 p-2 rounded">
                    <span>📊</span>
                    <span className="text-sm">{file.name}</span>
                    <span className="text-xs text-gray-500 ml-auto">
                      {(file.size / 1024 / 1024).toFixed(2)} MB
                    </span>
                  </div>
                ))}
              </div>
            )}

            <button
              onClick={processFiles}
              disabled={processing || files.length === 0}
              className="w-full mt-4 bg-gradient-to-r from-green-600 to-teal-600 text-white py-4 rounded-xl font-bold disabled:opacity-50 hover:shadow-lg transition-all flex items-center justify-center gap-2"
            >
              {processing ? (
                <>
                  <span className="animate-spin text-xl">⏳</span>
                  <span className="ml-2">Procesando...</span>
                </>
              ) : (
                <>
                  <span className="text-xl">🚀</span>
                  <span className="ml-2">Procesar Catálogos</span>
                </>
              )}
            </button>
          </div>

          <div className="bg-white rounded-xl p-6 shadow-lg">
            <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
              <span className="text-xl">ℹ️</span>
              Registro de Proceso
            </h2>
            <div className="bg-gray-900 rounded-xl p-4 h-64 overflow-y-auto font-mono text-sm">
              {logs.length === 0 ? (
                <p className="text-gray-500">Esperando archivos...</p>
              ) : (
                logs.map((log, idx) => (
                  <div key={idx} className={`mb-1 ${
                    log.type === 'error' ? 'text-red-400' :
                    log.type === 'success' ? 'text-green-400' : 'text-gray-300'
                  }`}>
                    <span className="text-gray-600">[{log.time}]</span> {log.message}
                  </div>
                ))
              )}
            </div>
          </div>
        </div>

        {results && (
          <div className="mt-6 space-y-6">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div className="bg-white rounded-xl p-6 shadow-lg">
                <div className="text-3xl font-bold text-blue-600">{results.stats.totalProducts}</div>
                <div className="text-sm text-gray-600">Productos</div>
              </div>
              <div className="bg-white rounded-xl p-6 shadow-lg">
                <div className="text-3xl font-bold text-green-600">${results.stats.totalSavings}</div>
                <div className="text-sm text-gray-600">Ahorro Total</div>
              </div>
              <div className="bg-white rounded-xl p-6 shadow-lg">
                <div className="text-3xl font-bold text-purple-600">{results.stats.duplicateProducts}</div>
                <div className="text-sm text-gray-600">Duplicados</div>
              </div>
              <div className="bg-white rounded-xl p-6 shadow-lg">
                <div className="text-3xl font-bold text-orange-600">{results.stats.avgProviders}</div>
                <div className="text-sm text-gray-600">Prom. Proveedores</div>
              </div>
            </div>

            <div className="bg-white rounded-xl p-6 shadow-lg">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                <h2 className="text-2xl font-bold">Catálogo Consolidado</h2>
                <button
                  onClick={exportToCSV}
                  className="bg-green-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-green-700 transition-colors"
                >
                  <span>📥</span>
                  Descargar CSV para TikTok Shop
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <select
                  value={filterCategory}
                  onChange={(e) => setFilterCategory(e.target.value)}
                  className="px-3 py-2 border rounded-lg"
                >
                  {categories.map(cat => (
                    <option key={cat} value={cat}>
                      {cat === 'TODAS' ? 'Todas las Categorías' : cat}
                    </option>
                  ))}
                </select>

                <select
                  value={sortBy}
                  onChange={(e) => setSortBy(e.target.value)}
                  className="px-3 py-2 border rounded-lg"
                >
                  <option value="category">Por Categoría</option>
                  <option value="price-low">Precio: Menor a Mayor</option>
                  <option value="price-high">Precio: Mayor a Menor</option>
                </select>

                <div className="flex items-center gap-2">
                  <label className="text-sm font-semibold whitespace-nowrap">Margen:</label>
                  <input
                    type="range"
                    min="20"
                    max="200"
                    value={customMargin}
                    onChange={(e) => setCustomMargin(parseInt(e.target.value))}
                    className="flex-1"
                  />
                  <span className="font-bold text-purple-600 w-16">{customMargin}%</span>
                </div>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full">
                  <thead className="bg-gray-100">
                    <tr>
                      <th className="px-4 py-3 text-left text-sm">⭐</th>
                      <th className="px-4 py-3 text-left text-sm">Producto</th>
                      <th className="px-4 py-3 text-left text-sm">Proveedor</th>
                      <th className="px-4 py-3 text-left text-sm">Costo</th>
                      <th className="px-4 py-3 text-left text-sm">Venta</th>
                      <th className="px-4 py-3 text-left text-sm">Ganancia</th>
                      <th className="px-4 py-3 text-left text-sm">Acción</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-200">
                    {getFiltered().map((p, idx) => {
                      const customPrice = Math.ceil(p.priceMenudeo * (1 + customMargin/100)) - 0.01;
                      const profit = customPrice - p.priceMenudeo;
                      const isFav = favorites.has(p.consolidated_sku);
                      
                      return (
                        <tr key={idx} className={`hover:bg-gray-50 transition-colors ${isFav ? 'bg-yellow-50' : ''}`}>
                          <td className="px-4 py-3">
                            <button 
                              onClick={() => toggleFavorite(p.consolidated_sku)} 
                              className="text-2xl hover:scale-125 transition-transform"
                            >
                              {isFav ? '⭐' : '☆'}
                            </button>
                          </td>
                          <td className="px-4 py-3">
                            <div className="font-medium">{p.description}</div>
                            <div className="text-xs text-gray-500">{p.category}</div>
                          </td>
                          <td className="px-4 py-3">
                            <div className="text-sm font-medium text-blue-600">{p.provider}</div>
                            {p.num_providers > 1 && (
                              <div className="text-xs text-green-600">
                                +{p.num_providers - 1} más
                              </div>
                            )}
                          </td>
                          <td className="px-4 py-3 font-bold text-red-600">${p.priceMenudeo}</td>
                          <td className="px-4 py-3 font-bold text-green-600">${customPrice.toFixed(2)}</td>
                          <td className="px-4 py-3 font-bold text-purple-600">${profit.toFixed(2)}</td>
                          <td className="px-4 py-3">
                            <button
                              onClick={() => setSelectedProduct(p)}
                              className="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700 transition-colors"
                            >
                              Ver Detalles
                            </button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>

              <p className="mt-4 text-center text-sm text-gray-600">
                Mostrando {getFiltered().length} de {results.stats.totalProducts} productos
              </p>
            </div>

            {selectedProduct && (
              <div className="bg-white rounded-xl p-6 border-2 border-purple-200 shadow-lg">
                <div className="flex justify-between items-start mb-4">
                  <h2 className="text-2xl font-bold text-purple-600">🎯 Detalles para TikTok Shop</h2>
                  <button 
                    onClick={() => setSelectedProduct(null)} 
                    className="text-gray-500 hover:text-gray-700 text-2xl transition-colors"
                  >
                    ✕
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="space-y-4">
                    <div>
                      <h3 className="font-bold text-lg mb-2">{selectedProduct.description}</h3>
                      <p className="text-sm text-gray-600">{selectedProduct.consolidated_sku}</p>
                    </div>

                    <div className="bg-blue-50 p-4 rounded-lg">
                      <h3 className="font-bold mb-2">💰 Costos:</h3>
                      <p>Precio Caja: ${selectedProduct.priceCaja}</p>
                      <p>Precio Menudeo: ${selectedProduct.priceMenudeo}</p>
                      <p>MOQ: {selectedProduct.moq} piezas</p>
                      {selectedProduct.savings > 0 && (
                        <p className="text-green-600 font-bold mt-2">
                          Ahorro: ${selectedProduct.savings}
                        </p>
                      )}
                    </div>

                    <div className="bg-green-50 p-4 rounded-lg">
                      <h3 className="font-bold mb-2">💵 Precios Sugeridos:</h3>
                      <p>Margen 50%: ${selectedProduct.margin50.toFixed(2)}</p>
                      <p className="font-bold text-lg text-green-700">Margen 80%: ${selectedProduct.margin80.toFixed(2)}</p>
                      <p>Margen 100%: ${selectedProduct.margin100.toFixed(2)}</p>
                    </div>
                  </div>

                  <div className="space-y-4">
                    <div className="bg-purple-50 p-4 rounded-lg">
                      <h3 className="font-bold mb-2">✨ Título Optimizado:</h3>
                      <p className="text-sm mb-2">{selectedProduct.optimizedTitle}</p>
                      <button
                        onClick={() => {
                          navigator.clipboard.writeText(selectedProduct.optimizedTitle);
                          addLog('📋 Título copiado', 'success');
                        }}
                        className="bg-purple-600 text-white px-4 py-2 rounded text-sm hover:bg-purple-700 transition-colors"
                      >
                        Copiar Título
                      </button>
                    </div>

                    <div className="bg-orange-50 p-4 rounded-lg">
                      <h3 className="font-bold mb-2">📝 Descripción:</h3>
                      <p className="text-xs whitespace-pre-line mb-2">{selectedProduct.optimizedDescription}</p>
                      <button
                        onClick={() => {
                          navigator.clipboard.writeText(selectedProduct.optimizedDescription);
                          addLog('📋 Descripción copiada', 'success');
                        }}
                        className="bg-orange-600 text-white px-4 py-2 rounded text-sm hover:bg-orange-700 transition-colors"
                      >
                        Copiar Descripción
                      </button>
                    </div>

                    <div className="bg-pink-50 p-4 rounded-lg">
                      <h3 className="font-bold mb-2">#️⃣ Hashtags:</h3>
                      <p className="text-sm mb-2">{selectedProduct.hashtags}</p>
                      <button
                        onClick={() => {
                          navigator.clipboard.writeText(selectedProduct.hashtags);
                          addLog('📋 Hashtags copiados', 'success');
                        }}
                        className="bg-pink-600 text-white px-4 py-2 rounded text-sm hover:bg-pink-700 transition-colors"
                      >
                        Copiar Hashtags
                      </button>
                    </div>
                  </div>
                </div>

                {selectedProduct.alternatives && selectedProduct.alternatives.length > 1 && (
                  <div className="mt-6 bg-gray-50 p-4 rounded-lg">
                    <h3 className="font-bold mb-3">🔄 Proveedores Alternativos ({selectedProduct.alternatives.length}):</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                      {selectedProduct.alternatives.map((alt, idx) => (
                        <div key={idx} className="bg-white p-3 rounded border text-sm hover:shadow transition-shadow">
                          <div className="flex justify-between items-center">
                            <span className="font-semibold">{alt.provider}</span>
                            <span className="text-green-600 font-bold">${alt.priceCaja}</span>
                          </div>
                          <div className="text-xs text-gray-600 mt-1">SKU: {alt.sku}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            <button
              onClick={resetApp}
              className="w-full bg-red-600 text-white py-3 rounded-xl font-semibold hover:bg-red-700 transition-colors flex items-center justify-center gap-2"
            >
              <span>🗑️</span>
              Borrar Todo y Empezar de Nuevo
            </button>

            <div className="bg-green-50 border-2 border-green-200 rounded-xl p-4">
              <p className="text-green-800 font-semibold text-sm flex items-center gap-2">
                <span>✓</span>
                Tus datos están guardados automáticamente
              </p>
              <p className="text-green-600 text-xs mt-1">
                Puedes cerrar el navegador y volver cuando quieras. Los datos permanecerán aquí.
              </p>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

ReactDOM.render(React.createElement(CatalogApp), document.getElementById('root'));
    </script>
</body>
</html>
